# Fast, deterministic host tests + static analysis.
#
# These run the platform-independent logic in src/ on the build host (no board,
# no emulator), under plain, ASan+UBSan and TSan builds, plus a report-only
# cppcheck pass.  Complements build-firmware.yml (which only proves the 3 board
# targets compile).
#
# Triggers: PRs to main, pushes touching src/ or the tests, and manual dispatch.

name: Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/host/**'
      - '.github/workflows/tests.yml'
      - 'docs/ARCHITECTURE.md'
      - 'tools/check_api_docs.py'
      - 'tools/check_doc_refs.py'
      - 'node_espnow/**'
      - '**/*.md'
      - 'tools/check_metric_names.py'
      - 'scripts/gen_failsafe.py'
      - 'src/web/failsafe.html'
      - 'www/**'
      - 'tests/web/**'
      - 'tools/pio_envs.py'
      - 'tools/check_pio_envs.py'
      - 'tools/features.py'
      - 'tools/check_features.py'
      - 'tools/check_node_portal.py'
      - 'tools/check_sensor_plugins.py'
      - 'node/**'
      - 'platformio.ini'
      - 'boards/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/host/**'
      - '.github/workflows/tests.yml'
      - 'docs/ARCHITECTURE.md'
      - 'tools/check_api_docs.py'
      - 'tools/check_doc_refs.py'
      - 'node_espnow/**'
      - '**/*.md'
      - 'tools/check_metric_names.py'
      - 'scripts/gen_failsafe.py'
      - 'src/web/failsafe.html'
      - 'www/**'
      - 'tests/web/**'
      - 'tools/pio_envs.py'
      - 'tools/check_pio_envs.py'
      - 'tools/features.py'
      - 'tools/check_features.py'
      - 'tools/check_node_portal.py'
      - 'tools/check_sensor_plugins.py'
      - 'node/**'
      - 'platformio.ini'
      - 'boards/**'
  workflow_dispatch:

jobs:
  host-tests:
    name: host-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            flags: ''
          - name: asan-ubsan
            flags: '-fsanitize=address,undefined -fno-omit-frame-pointer'
          - name: tsan
            flags: '-fsanitize=thread'
    steps:
      - uses: actions/checkout@v4

      - name: Build & run host tests (${{ matrix.name }})
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set -e
          fail=0
          for f in tests/host/test_*.cpp; do
            bin="${f%.cpp}.bin"
            echo "::group::compile $f (${{ matrix.name }})"
            g++ -std=gnu++17 -Wall -Wextra -O1 -g -pthread \
                -I tests/host/shims -I. ${{ matrix.flags }} \
                "$f" -o "$bin"
            echo "::endgroup::"
            echo "::group::run $bin"
            "./$bin" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  fuzz:
    name: fuzz (seeded, asan-ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & run seeded fuzz drivers
        # Deterministic, seeded property-fuzzing under ASan+UBSan — no libFuzzer
        # / compiler-rt dependency, so it is reproducible and never flaky.  The
        # same files expose an LLVMFuzzerTestOneInput entry point for opt-in
        # coverage-guided fuzzing locally (see tests/host/README.md).
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -e
          for f in tests/host/fuzz_*.cpp; do
            bin="${f%.cpp}.fz"
            echo "::group::build & run $f"
            g++ -std=gnu++17 -Wall -Wextra -O1 -g -DFUZZ_STANDALONE \
                -fsanitize=address,undefined -fno-omit-frame-pointer \
                -I tests/host/shims -I. "$f" -o "$bin"
            "./$bin"
            echo "::endgroup::"
          done

  cppcheck:
    name: cppcheck (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Static analysis of src/ (informational)
        # Report-only for now: this is a large existing codebase, so we surface
        # findings without gating the PR.  Flip to `--error-exitcode=1` (drop
        # `|| true`) once the baseline is clean.
        #
        # node_espnow/src is scanned too.  It shares three headers with the
        # collector and its findings have been read; node/ is deliberately NOT
        # here, because its baseline has not been, and adding an unreviewed
        # baseline to a report nobody gates on is how a report stops being read.
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,performance,portability,style \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --language=c++ --std=c++17 \
            -I src -I node_espnow/src \
            src node_espnow/src 2>&1 | tee cppcheck.log || true

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck.log

  browser:
    name: browser (settings pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/web/*.py') }}

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Drive the ESP-NOW settings page
        # The pages are not compiled, so nothing else in this repository
        # notices a page that fetches a field the firmware does not send, uses
        # an icon that is not in the sheet, or wires a button to a handler
        # core.js never registered. Each of those opens a window that looks
        # fine and does nothing.
        run: |
          python3 tests/web/mock_device.py 8765 &
          sleep 2
          MOCK_PORT=8765 python3 tests/web/drive_espnow_page.py

      - name: Drive the sensors page's remote-sensor editor
        # A satellite node pairs with the collector on one string, its node id,
        # and that string is the whole configuration of a "remote" sensor —
        # there is no address and nothing to probe. The type was missing from
        # the page's own list and the editor had no field for it, so the one
        # setting it has could only be reached through the Advanced JSON box.
        # This edits it the way a person does and asserts on the document that
        # goes back to the device.
        run: |
          python3 tests/web/mock_device.py 8767 &
          sleep 2
          MOCK_PORT=8767 python3 tests/web/drive_sensors_page.py

      - name: Verify that check actually fails without the node-id field
        # Take the remote branch out of BOTH the form builder and the saver by
        # making its condition unreachable — the state this page was in when a
        # remote sensor could not be configured from the UI at all. Done by
        # condition rather than by cutting the block out: the branch has been
        # first in one chain and second in the other, and a self-test that
        # depends on which is a self-test that breaks when the code is tidied.
        run: |
          set -e
          cp www/js/sensors.js www/js/sensors.js.orig
          sed -i 's/if (s.interface === "http" || s.type === "remote") {/if (false) {/g' \
              www/js/sensors.js
          grep -q 'if (false) {' www/js/sensors.js || {
            echo "::error::the self-test no longer matches the remote branch"
            cp www/js/sensors.js.orig www/js/sensors.js
            exit 1
          }
          node --check www/js/sensors.js
          python3 tests/web/mock_device.py 8768 &
          sleep 2
          if MOCK_PORT=8768 python3 tests/web/drive_sensors_page.py > /dev/null 2>&1; then
            echo "::error::drive_sensors_page.py passed with the node-id field removed"
            cp www/js/sensors.js.orig www/js/sensors.js
            exit 1
          fi
          cp www/js/sensors.js.orig www/js/sensors.js
          rm www/js/sensors.js.orig
          echo "the driver fails without the field, as it should"

      - name: Drive the e-ink dashboard settings page
        # Its two bitmasks carry bit values defined in src/core/Config.h and
        # repeated in www/js/kindle.js. A page that reads a mask back correctly
        # while writing the neighbouring bit looks perfect and toggles the
        # wrong setting, which is a bug that presents as a rendering fault.
        run: |
          python3 tests/web/mock_device.py 8767 &
          sleep 2
          MOCK_PORT=8767 python3 tests/web/drive_kindle_page.py

      - name: Verify that check actually fails on a mask that is not collected
        # Same argument as the dead-button control below: a browser test that
        # cannot fail is worth less than none. This breaks the WRITE path only
        # — every checkbox still renders and still reads back its own state, so
        # the page looks entirely correct and the saved mask is wrong. It is
        # the exact failure the round-trip assertions exist for, and the one a
        # test that only looked at the rendered page would miss.
        run: |
          set -e
          cp www/js/kindle.js www/js/kindle.js.orig
          sed -i 's/if (el \&\& el.checked) mask |= defs\[i\]\[0\];/if (el \&\& el.checked) mask |= 0;/' www/js/kindle.js
          grep -q 'mask |= 0;' www/js/kindle.js  # the sed matched something
          python3 tests/web/mock_device.py 8768 &
          sleep 2
          if MOCK_PORT=8768 python3 tests/web/drive_kindle_page.py > /dev/null 2>&1; then
            mv www/js/kindle.js.orig www/js/kindle.js
            echo "::error::the browser test passed with the masks never collected"
            exit 1
          fi
          mv www/js/kindle.js.orig www/js/kindle.js
          echo "browser test fires on a mask that is never collected"

      - name: Verify that check actually fails on a dead button
        # A browser test that cannot fail is worth less than none, because a
        # green tick on a page nobody opened is exactly the false comfort it
        # was written to remove. Unregister the pairing handler and the click
        # must stop doing anything.
        run: |
          set -e
          cp www/js/espnow.js www/js/espnow.js.orig
          sed -i 's/  espnowPair: espnowPair,//' www/js/espnow.js
          python3 tests/web/mock_device.py 8766 &
          sleep 2
          if MOCK_PORT=8766 python3 tests/web/drive_espnow_page.py > /dev/null 2>&1; then
            mv www/js/espnow.js.orig www/js/espnow.js
            echo "::error::the browser test passed with the pairing button unwired"
            exit 1
          fi
          mv www/js/espnow.js.orig www/js/espnow.js
          echo "browser test fires on an unwired button"

  api-docs:
    name: api-docs (route coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify docs/ARCHITECTURE.md §6 covers every registered route
        # Fails if a route registered via server.on(...) in src/web/ has no row
        # in the API reference table (the table had drifted to ~10% coverage).
        run: python3 tools/check_api_docs.py

      - name: Verify every feature guard can see the macro it tests
        # AlertEngine.cpp guarded its MQTT publishing on EXPORT_MQTT_ENABLED
        # and never included setup.h, so the macro was undefined there and the
        # block was compiled out of every default build. Alerts silently never
        # reached MQTT, and nothing said so — not a warning, not a link error,
        # not a failing test. It surfaced only when the deploy tools started
        # passing the feature set on the command line and the image grew.
        run: python3 tools/check_feature_guards.py

      - name: Verify the docs cite symbols, not line numbers
        # Line citations rot silently and a reader cannot tell a stale one from
        # their own confusion. When this check was added, all 53 file:line
        # references in docs/ were wrong -- one of them written two days
        # earlier and already off by three lines. Also checks that every source
        # path a document names exists.
        run: python3 tools/check_doc_refs.py

      - name: Verify that check actually rejects a line citation
        run: |
          set -e
          cp docs/INSTRUCTIONS.md docs/INSTRUCTIONS.md.orig
          restore() { mv docs/INSTRUCTIONS.md.orig docs/INSTRUCTIONS.md; }

          printf '\nci probe (`src/web/WebServer.cpp:123`).\n' >> docs/INSTRUCTIONS.md
          if python3 tools/check_doc_refs.py; then
            restore
            echo "::error::check_doc_refs.py accepted a line-number citation"
            exit 1
          fi
          cp docs/INSTRUCTIONS.md.orig docs/INSTRUCTIONS.md

          printf '\nci probe (`src/web/NoSuchFile.cpp`).\n' >> docs/INSTRUCTIONS.md
          if python3 tools/check_doc_refs.py; then
            restore
            echo "::error::check_doc_refs.py accepted a path that does not exist"
            exit 1
          fi

          restore
          echo "doc-reference guard fires on both a line citation and a missing path"

      - name: Verify no metric/unit name is silently truncated
        # SensorReading::make() strncpy's into fixed char arrays, so an
        # over-long name is stored short with no error and every later strcmp()
        # against the full name misses. "humidity_ambient" (16 chars into
        # char[16]) shipped broken this way; this stops the next one.
        run: python3 tools/check_metric_names.py

      - name: Verify the committed failsafe header matches its HTML
        # src/web/FailsafeHtml.h is generated from src/web/failsafe.html and
        # COMMITTED, because the Arduino IDE build path runs no pre-scripts.
        # A committed generated file is a file that can go stale, so the two
        # are compared here rather than trusted. --check INFLATES the header
        # and compares that: the compressed bytes are not a property of the
        # input (zlib and zlib-ng differ), the inflated content is.
        run: python3 scripts/gen_failsafe.py --check

      - name: Verify that check actually fails on a stale header
        run: |
          set -e
          cp src/web/failsafe.html src/web/failsafe.html.orig
          cp src/web/FailsafeHtml.h src/web/FailsafeHtml.h.orig
          restore() {
            mv src/web/failsafe.html.orig src/web/failsafe.html
            mv src/web/FailsafeHtml.h.orig src/web/FailsafeHtml.h
          }

          # 1. HTML edited, header not regenerated.
          printf '<!-- ci probe -->' >> src/web/failsafe.html
          if python3 scripts/gen_failsafe.py --check; then
            restore
            echo "::error::gen_failsafe.py --check passed an out-of-date header"
            exit 1
          fi
          cp src/web/failsafe.html.orig src/web/failsafe.html

          # 2. Header corrupted in place — the failure mode a byte compare
          #    against freshly compressed output would also catch, but which
          #    an inflate-based check must catch on its own terms.
          sed -i '0,/0x[0-9a-f][0-9a-f],/s//0xff,/' src/web/FailsafeHtml.h
          if python3 scripts/gen_failsafe.py --check; then
            restore
            echo "::error::gen_failsafe.py --check passed a corrupted header"
            exit 1
          fi

          restore
          echo "failsafe drift guard fires as expected on both stale and corrupt"

      - name: Verify the gzipped page still inflates to the original
        # Deliberately a second, independent implementation of what --check
        # does above. --check is the developer-facing guard and shares its
        # parser with the generator; this one parses the header from scratch,
        # so a bug in that shared parser cannot make both pass. The whole
        # point of the failsafe page is that it works when nothing else does:
        # asserting the bytes that actually get linked round-trip to the
        # source HTML is the check that matters; "it compiled" is not.
        run: |
          python3 - <<'EOF'
          import re, gzip, pathlib, sys
          h = pathlib.Path('src/web/FailsafeHtml.h').read_text()
          body = h[h.index('FAILSAFE_HTML_GZ[] PROGMEM = {'):h.index('};')]
          data = bytes(int(x, 16) for x in re.findall(r'0x([0-9a-f]{2}),', body))
          original = pathlib.Path('src/web/failsafe.html').read_bytes()
          got = gzip.decompress(data)
          if got != original:
              print(f'::error::linked bytes inflate to {len(got)} bytes, '
                    f'source is {len(original)} — they differ')
              sys.exit(1)
          print(f'OK: {len(data):,} gzipped bytes inflate to '
                f'{len(got):,} bytes, identical to failsafe.html')
          EOF

      - name: Drive the Kindle dashboard against a fake FBInk
        # The dashboard's entire output is `fbink` invocations, and fbink is
        # not installed here — so a flag that does not exist, a colour outside
        # the palette or a rectangle refreshed at the wrong coordinates all
        # look exactly like a working dashboard from CI. They looked like one
        # on the device too: fbink exits non-zero and the script sends stderr
        # to /dev/null, so the page just came up blank in places. This records
        # every call and validates it against FBInk's own option table.
        #
        # `sh`, not bash: the Kindle runs busybox ash, and Ubuntu's /bin/sh is
        # dash — the closest thing to it available here.
        run: sh tests/kindle/drive_dash.sh

      - name: Verify the deploy tools see every board in platformio.ini
        # tools/pio_envs.py is where the flash tools get their board list. An
        # env its parser cannot see is a board the tool will not offer, and
        # nothing else would say so.
        run: python3 tools/check_pio_envs.py

      - name: Verify every sensor plugin enables itself
        # ISensor::_enabled defaults to false and each plugin has to set it in
        # init(). RemoteNodeSensor did not, so it loaded, logged "ready", and
        # was then skipped by every tick — reporting itself "disabled" to the
        # UI while the node feeding it was plainly alive on the Remote-nodes
        # page. Nothing else in this repository would notice.
        run: python3 tools/check_sensor_plugins.py

      - name: Verify that check actually fails on a flipped default
        # The invariant it guards is the DEFAULT: a sensor that loads is a
        # sensor that runs, because loadAndInit() only ever constructs
        # sensors the config enabled. Flipping ISensor::_enabled back to
        # false re-arms the trap for every plugin at once — one forgets, and
        # it loads, logs "ready", and is skipped by every tick.
        run: |
          set -e
          cp src/sensors/ISensor.h /tmp/isensor.orig
          sed -i 's/bool     _enabled    = true;/bool     _enabled    = false;/' src/sensors/ISensor.h
          if python3 tools/check_sensor_plugins.py > /dev/null 2>&1; then
            echo "::error::check_sensor_plugins.py passed a false _enabled default"
            cp /tmp/isensor.orig src/sensors/ISensor.h
            exit 1
          fi
          cp /tmp/isensor.orig src/sensors/ISensor.h
          rm /tmp/isensor.orig
          echo "the check fails on a flipped default, as it should"

      - name: Verify that check actually fails when the manager overrules init()
        # The other half: a plugin whose hardware is optional must be able to
        # come back from init() unusable, and an unconditional setEnabled()
        # after it would tick that sensor against absent hardware.
        run: |
          set -e
          cp src/sensors/SensorManager.cpp /tmp/sm.orig
          sed -i 's|            _sensors\[_count\]    = s;|            s->setEnabled(true);\n            _sensors[_count]    = s;|' src/sensors/SensorManager.cpp
          if python3 tools/check_sensor_plugins.py > /dev/null 2>&1; then
            echo "::error::check_sensor_plugins.py passed a manager that overrules init()"
            cp /tmp/sm.orig src/sensors/SensorManager.cpp
            exit 1
          fi
          cp /tmp/sm.orig src/sensors/SensorManager.cpp
          rm /tmp/sm.orig
          echo "the check fails when the manager overrules init(), as it should"

      - name: Set up Node for the portal check
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify the node's setup portal is a page that works
        # node/src/ConfigPortal.cpp serves HTML+CSS+JS written as C++ string
        # literals. The compiler sees one long string, so a missing brace in
        # the JavaScript builds perfectly and ships a page whose buttons do
        # nothing -- and the ESP8266 toolchain is not installed here, so even a
        # compile would not catch it. This rebuilds the page and parses it.
        run: python3 tools/check_node_portal.py

      - name: Verify that check actually fails on broken portal JavaScript
        run: |
          set -e
          cp node/src/ConfigPortal.cpp node/src/ConfigPortal.cpp.orig
          # An unbalanced paren INSIDE the JavaScript, which leaves the C++
          # perfectly valid -- exactly the failure that reaches a phone.
          sed -i 's|"function pinFields(){|"function pinFields({|' node/src/ConfigPortal.cpp
          if python3 tools/check_node_portal.py > /dev/null 2>&1; then
            echo "::error::check_node_portal.py passed a page whose JS does not parse"
            cp node/src/ConfigPortal.cpp.orig node/src/ConfigPortal.cpp
            exit 1
          fi
          cp node/src/ConfigPortal.cpp.orig node/src/ConfigPortal.cpp
          rm node/src/ConfigPortal.cpp.orig
          echo "the check fails on broken portal JavaScript, as it should"

      - name: Verify the deploy tools offer every feature setup.h declares
        # tools/features.py parses src/setup.h with a regex, and the deploy CLI
        # and GUI both read that list. A regex that quietly stops matching
        # leaves a shorter menu and no error -- so it is compared against a
        # second, dumber scan that shares none of its logic.
        run: python3 tools/check_features.py

      - name: Verify that check actually fails on a broken parser
        run: |
          set -e
          cp tools/features.py tools/features.py.orig
          # Require the '#' and 'define' to be adjacent. setup.h writes
          # "#  define", so this matches nothing and the menu goes empty --
          # exactly the silent failure the check exists for.
          sed -i 's|#\\s\*define\\s+|#define\\s+|' tools/features.py
          if python3 tools/check_features.py > /dev/null; then
            mv tools/features.py.orig tools/features.py
            echo "::error::check_features.py passed a parser that finds nothing"
            exit 1
          fi
          mv tools/features.py.orig tools/features.py
          echo "feature-list guard fires as expected"

      - name: Verify a new feature reaches the deploy tools on its own
        # The point of deriving the list from setup.h is that adding a feature
        # is enough. Plant one and check it appears, so a future refactor that
        # reintroduces a hand-maintained list is caught here.
        run: |
          set -e
          cp src/setup.h src/setup.h.orig
          printf '\n//#ifndef FEATURE_CI_PROBE\n//#  define FEATURE_CI_PROBE   // ci probe\n//#endif\n' >> src/setup.h
          if ! python3 tools/features.py | grep -q FEATURE_CI_PROBE; then
            mv src/setup.h.orig src/setup.h
            echo "::error::a feature added to setup.h did not reach the deploy tools"
            exit 1
          fi
          mv src/setup.h.orig src/setup.h
          echo "a new setup.h feature reaches the tools with no other edit"

      - name: Verify that check actually fails on an unreachable env
        run: |
          set -e
          cp platformio.ini platformio.ini.orig
          printf '\n[env:ci_probe_env]\n' >> platformio.ini
          if python3 tools/check_pio_envs.py; then
            mv platformio.ini.orig platformio.ini
            echo "::error::check_pio_envs.py accepted an env with no board"
            exit 1
          fi
          mv platformio.ini.orig platformio.ini
          echo "env guard fires as expected"

      - name: Verify the truncation guard actually fails on a bad name
        # A guard that cannot fail is not a guard. Plant an over-long metric
        # name in the checkout, assert a non-zero exit, then restore the file.
        run: |
          set -e
          f=src/sensors/plugins/BME280Sensor.cpp
          cp "$f" "$f.orig"
          sed -i 's/"dew_point"/"dew_point_ambient"/' "$f"
          if python3 tools/check_metric_names.py; then
            mv "$f.orig" "$f"
            echo "::error::check_metric_names.py passed an over-long metric name"
            exit 1
          fi
          mv "$f.orig" "$f"
          echo "guard fires as expected"
