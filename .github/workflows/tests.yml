# Fast, deterministic host tests + static analysis.
#
# These run the platform-independent logic in src/ on the build host (no board,
# no emulator), under plain, ASan+UBSan and TSan builds, plus a report-only
# cppcheck pass.  Complements build-firmware.yml (which only proves the 3 board
# targets compile).
#
# Triggers: PRs to main, pushes touching src/ or the tests, and manual dispatch.

name: Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/host/**'
      - '.github/workflows/tests.yml'
      - 'docs/ARCHITECTURE.md'
      - 'tools/check_api_docs.py'
      - 'tools/check_metric_names.py'
      - 'scripts/gen_failsafe.py'
      - 'src/web/failsafe.html'
      - 'tools/pio_envs.py'
      - 'tools/check_pio_envs.py'
      - 'platformio.ini'
      - 'boards/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/host/**'
      - '.github/workflows/tests.yml'
      - 'docs/ARCHITECTURE.md'
      - 'tools/check_api_docs.py'
      - 'tools/check_metric_names.py'
      - 'scripts/gen_failsafe.py'
      - 'src/web/failsafe.html'
      - 'tools/pio_envs.py'
      - 'tools/check_pio_envs.py'
      - 'platformio.ini'
      - 'boards/**'
  workflow_dispatch:

jobs:
  host-tests:
    name: host-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            flags: ''
          - name: asan-ubsan
            flags: '-fsanitize=address,undefined -fno-omit-frame-pointer'
          - name: tsan
            flags: '-fsanitize=thread'
    steps:
      - uses: actions/checkout@v4

      - name: Build & run host tests (${{ matrix.name }})
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set -e
          fail=0
          for f in tests/host/test_*.cpp; do
            bin="${f%.cpp}.bin"
            echo "::group::compile $f (${{ matrix.name }})"
            g++ -std=gnu++17 -Wall -Wextra -O1 -g -pthread \
                -I tests/host/shims -I. ${{ matrix.flags }} \
                "$f" -o "$bin"
            echo "::endgroup::"
            echo "::group::run $bin"
            "./$bin" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  fuzz:
    name: fuzz (seeded, asan-ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & run seeded fuzz drivers
        # Deterministic, seeded property-fuzzing under ASan+UBSan — no libFuzzer
        # / compiler-rt dependency, so it is reproducible and never flaky.  The
        # same files expose an LLVMFuzzerTestOneInput entry point for opt-in
        # coverage-guided fuzzing locally (see tests/host/README.md).
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -e
          for f in tests/host/fuzz_*.cpp; do
            bin="${f%.cpp}.fz"
            echo "::group::build & run $f"
            g++ -std=gnu++17 -Wall -Wextra -O1 -g -DFUZZ_STANDALONE \
                -fsanitize=address,undefined -fno-omit-frame-pointer \
                -I tests/host/shims -I. "$f" -o "$bin"
            "./$bin"
            echo "::endgroup::"
          done

  cppcheck:
    name: cppcheck (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Static analysis of src/ (informational)
        # Report-only for now: this is a large existing codebase, so we surface
        # findings without gating the PR.  Flip to `--error-exitcode=1` (drop
        # `|| true`) once the baseline is clean.
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,performance,portability,style \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --language=c++ --std=c++17 \
            -I src \
            src 2>&1 | tee cppcheck.log || true

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck.log

  api-docs:
    name: api-docs (route coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify docs/ARCHITECTURE.md §6 covers every registered route
        # Fails if a route registered via server.on(...) in src/web/ has no row
        # in the API reference table (the table had drifted to ~10% coverage).
        run: python3 tools/check_api_docs.py

      - name: Verify no metric/unit name is silently truncated
        # SensorReading::make() strncpy's into fixed char arrays, so an
        # over-long name is stored short with no error and every later strcmp()
        # against the full name misses. "humidity_ambient" (16 chars into
        # char[16]) shipped broken this way; this stops the next one.
        run: python3 tools/check_metric_names.py

      - name: Verify the committed failsafe header matches its HTML
        # src/web/FailsafeHtml.h is generated from src/web/failsafe.html and
        # COMMITTED, because the Arduino IDE build path runs no pre-scripts.
        # A committed generated file is a file that can go stale, so the two
        # are compared here rather than trusted.
        run: python3 scripts/gen_failsafe.py --check

      - name: Verify that check actually fails on a stale header
        run: |
          set -e
          cp src/web/failsafe.html src/web/failsafe.html.orig
          printf '<!-- ci probe -->' >> src/web/failsafe.html
          if python3 scripts/gen_failsafe.py --check; then
            mv src/web/failsafe.html.orig src/web/failsafe.html
            echo "::error::gen_failsafe.py --check passed a stale header"
            exit 1
          fi
          mv src/web/failsafe.html.orig src/web/failsafe.html
          echo "failsafe drift guard fires as expected"

      - name: Verify the gzipped page still inflates to the original
        # The whole point of the failsafe page is that it works when nothing
        # else does. Asserting the bytes that actually get linked round-trip
        # to the source HTML is the check that matters; "it compiled" is not.
        run: |
          python3 - <<'EOF'
          import re, gzip, pathlib, sys
          h = pathlib.Path('src/web/FailsafeHtml.h').read_text()
          body = h[h.index('FAILSAFE_HTML_GZ[] PROGMEM = {'):h.index('};')]
          data = bytes(int(x, 16) for x in re.findall(r'0x([0-9a-f]{2}),', body))
          original = pathlib.Path('src/web/failsafe.html').read_bytes()
          got = gzip.decompress(data)
          if got != original:
              print(f'::error::linked bytes inflate to {len(got)} bytes, '
                    f'source is {len(original)} — they differ')
              sys.exit(1)
          print(f'OK: {len(data):,} gzipped bytes inflate to '
                f'{len(got):,} bytes, identical to failsafe.html')
          EOF

      - name: Verify the deploy tools see every board in platformio.ini
        # tools/pio_envs.py is where the flash tools get their board list. An
        # env its parser cannot see is a board the tool will not offer, and
        # nothing else would say so.
        run: python3 tools/check_pio_envs.py

      - name: Verify that check actually fails on an unreachable env
        run: |
          set -e
          cp platformio.ini platformio.ini.orig
          printf '\n[env:ci_probe_env]\n' >> platformio.ini
          if python3 tools/check_pio_envs.py; then
            mv platformio.ini.orig platformio.ini
            echo "::error::check_pio_envs.py accepted an env with no board"
            exit 1
          fi
          mv platformio.ini.orig platformio.ini
          echo "env guard fires as expected"

      - name: Verify the truncation guard actually fails on a bad name
        # A guard that cannot fail is not a guard. Plant an over-long metric
        # name in the checkout, assert a non-zero exit, then restore the file.
        run: |
          set -e
          f=src/sensors/plugins/BME280Sensor.cpp
          cp "$f" "$f.orig"
          sed -i 's/"dew_point"/"dew_point_ambient"/' "$f"
          if python3 tools/check_metric_names.py; then
            mv "$f.orig" "$f"
            echo "::error::check_metric_names.py passed an over-long metric name"
            exit 1
          fi
          mv "$f.orig" "$f"
          echo "guard fires as expected"
