# Build standalone executables for the ESP32 Deploy GUI tool.
#
# Triggers:
#   - Manual dispatch (workflow_dispatch)
#   - Release/tag creation (attaches binaries to release assets)
#
# Outputs:
#   - ESP32_Deploy.exe       (Windows)
#   - ESP32_Deploy-linux     (Linux)
#
# The GUI tool (tools/deploy_gui.py) is compiled into a single-file
# executable with PyInstaller so end users don't need Python installed.

name: Build Deploy GUI

on:
  workflow_dispatch:
  release:
    types: [created]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ESP32_Deploy.exe
            binary: dist/ESP32_Deploy.exe
          - os: ubuntu-latest
            artifact: ESP32_Deploy-linux
            binary: dist/ESP32_Deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install pyinstaller

      # Linux needs Tk libraries for customtkinter's underlying tkinter
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Build executable
        run: pyinstaller tools/deploy_gui.spec --clean -y

      - name: Verify binary exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.binary }}" ]; then
            echo "::error::Build output not found at ${{ matrix.binary }}"
            ls -lhR dist/
            exit 1
          fi
          SIZE=$(stat -c%s "${{ matrix.binary }}" 2>/dev/null || stat -f%z "${{ matrix.binary }}")
          echo "Binary size: $(( SIZE / 1024 / 1024 )) MB"

      # Rename Linux binary so it has a distinct name in release assets
      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv dist/ESP32_Deploy dist/ESP32_Deploy-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  attach-to-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: ESP32_Deploy.exe
          path: release/

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: ESP32_Deploy-linux
          path: release/

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ESP32_Deploy.exe
            release/ESP32_Deploy-linux
