<!doctype html>
<!--
  node_portal/index.html — the node's own setup page (docs/NODE_CONFIG.md §6).

  Served by BOTH node firmwares (node/ ESP8266 WiFi, node_espnow/ XIAO C3)
  from src/nodecfg/NodePortalPage.h, which tools/build_node_portal.py builds
  by inlining style.css and app.js into this file and gzipping the result.
  Edit the three sources, then run:  python3 tools/build_node_portal.py

  Everything on screen is rendered by app.js from GET /api/config: the steps
  depend on the transport, the pins on the board, the sensors on the caps.
  Nothing here may load from the internet — the phone is on the node's AP.
-->
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">

<title>Node setup</title>

</head>
<body>

</main>
<nav class="nav" id="nav" hidden></nav>

</body>
</html>
