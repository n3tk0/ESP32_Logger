; PlatformIO Project Configuration
; Water Logger v5.0 — Multi-Sensor Environmental Platform
; Target: Seeed XIAO ESP32-C3 (primary) or ESP32-S3 (8MB)

[platformio]
default_envs = xiao_esp32c3

; ── Shared settings ─────────────────────────────────────────────────────────
[env]
framework = arduino
platform  = espressif32

; Logger.ino (the Arduino sketch entry point with setup/loop) lives in the
; project root for Arduino IDE compatibility.  This pre-build script copies
; it into src/ so PlatformIO's default Arduino discovery finds it.  The
; copied src/Logger.ino is gitignored.
extra_scripts =
    pre:scripts/copy_sketch.py
    ; Regenerates src/web/FailsafeHtml.h from src/web/failsafe.html, but only
    ; when the committed header no longer inflates to that HTML. The header is
    ; committed too, because the Arduino IDE path runs no scripts; CI runs
    ; `gen_failsafe.py --check` to guard the two against drifting.
    pre:scripts/gen_failsafe.py

; Add the project root to the include path so that the copied src/Logger.ino
; can resolve its "src/..." includes (e.g. "src/setup.h", "src/core/Globals.h")
; the same way Arduino IDE does when Logger.ino lives in the project root.
build_flags = -I.

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    esphome/ESPAsyncWebServer-esphome @ ^3.4.0
    ESP32Async/AsyncTCP @ ^3.4.10
    ; All other sensors/MQTT/RTC use internal mini drivers (no external libs)

monitor_speed = 115200

; ─────────────────────────────────────────────────────────────────────────────
; XIAO ESP32-C3 (RISC-V, single core, 4MB flash — production target)
; ─────────────────────────────────────────────────────────────────────────────
[env:xiao_esp32c3]
board     = seeed_xiao_esp32c3

board_build.filesystem = littlefs
board_build.partitions = partitions_balanced.csv

; All sensor/exporter toggles and tunables are defined in src/setup.h.
; Only board-specific pin overrides and chip-specific flags live here.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${env.build_flags}
    -DCONFIG_FREERTOS_UNICORE=1
    ; Pin overrides for XIAO ESP32-C3 wiring
    -DDEFAULT_SDA=6
    -DDEFAULT_SCL=7
    -DDEFAULT_FLOW_PIN=21

upload_speed    = 921600
monitor_filters = esp32_exception_decoder

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-C3 Super Mini (generic ESP32-C3 board with native USB JTAG/Serial)
; ─────────────────────────────────────────────────────────────────────────────
; USB CDC can be toggled via deploy tool before compilation
; Set -DARDUINO_USB_CDC_ON_BOOT=0 to free GPIO 18/19 for sensors/IO
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32c3_supermini]
board     = esp32-c3-devkitm-1

board_build.filesystem = littlefs
board_build.partitions = partitions_balanced.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${env.build_flags}
    -DCONFIG_FREERTOS_UNICORE=1
    -DARDUINO_USB_MODE=1
    -DDEFAULT_SDA=8
    -DDEFAULT_SCL=9
    -DDEFAULT_FLOW_PIN=21

upload_speed    = 921600
monitor_filters = esp32_exception_decoder

; ─────────────────────────────────────────────────────────────────────────────
; WEMOS LOLIN C3 PICO (ESP32-C3FH4, 4MB embedded flash, 25.4 x 25.4 mm)
; ─────────────────────────────────────────────────────────────────────────────
; The board definition is project-local: boards/lolin_c3_pico.json, because
; platform espressif32 7.0.1 and Arduino core 2.0.17 predate the upstream one.
; That file explains what it borrows and when to delete it.
;
; PIN MAP (from the upstream variant header, cross-checked against the
; CircuitPython board definition — NOT from the "ESP32-C3 0.42 OLED" clone,
; which looks similar and uses SDA=5/SCL=6):
;
;   LOLIN I2C port  SDA = GPIO8, SCL = GPIO10
;   RGB LED (WS2812)      GPIO7          UART0  RX = 20, TX = 21
;   SPI  SCK=1 MISO=0 MOSI=4 SS=5        ADC    A0..A5 = GPIO0..5
;   BOOT button           GPIO9          VBAT divider = GPIO3
;
; Everything the silicon can use is broken out: GPIO 0-10 plus 20/21, with
; 11-17 taken by the embedded flash and 18/19 by USB. There are therefore NO
; absent pins to warn about, which is why this board uses the existing
; "Generic ESP32-C3" wizard profile rather than one of its own — a profile
; named after it would validate identically and cost flash on a build that
; already runs at 99 % with every feature on.
;
; GPIO8 IS A STRAPPING PIN and the vendor wired SDA to it anyway. That works
; because a strap must be HIGH at reset and an idle I2C bus is pulled high —
; but a slave that holds SDA low across a reset will drop the board into
; download mode instead of booting. The wizard still flags it; accept it with
; the sensor's "allow_unsafe_pins" once you have pull-ups you trust.
; ─────────────────────────────────────────────────────────────────────────────
[env:lolin_c3_pico]
board     = lolin_c3_pico

board_build.filesystem = littlefs
board_build.partitions = partitions_balanced.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${env.build_flags}
    -DCONFIG_FREERTOS_UNICORE=1
    -DARDUINO_USB_MODE=1
    ; The LOLIN I2C connector. See the strapping-pin note above for GPIO8.
    -DDEFAULT_SDA=8
    -DDEFAULT_SCL=10
    ; The C3 has ONE I2C controller, so there is no bus-1 pair to set.
    ; Flow input on GPIO2: 0/1/4/5 are the SPI header, 3 is the battery
    ; divider, 7 is the RGB LED, 8/10 are I2C, 9 is BOOT.  GPIO2 is a strap
    ; too (it must be high at reset), so it needs a pull-up, which is what
    ; INPUT_PULLUP gives it — an open-collector flow sensor idles high.
    -DDEFAULT_FLOW_PIN=2

upload_speed    = 921600
monitor_filters = esp32_exception_decoder

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 (dual-core Xtensa, 8MB flash with native USB)
; ─────────────────────────────────────────────────────────────────────────────
; USB CDC can be toggled via deploy tool before compilation
; Set -DARDUINO_USB_CDC_ON_BOOT=0 to free GPIO 19/20 for sensors/IO
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3]
board     = esp32-s3-devkitc-1

board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Pin overrides for ESP32-S3 DevKitC wiring
    -DDEFAULT_SDA=8
    -DDEFAULT_SCL=9
    -DDEFAULT_FLOW_PIN=4

upload_speed = 921600

; ─────────────────────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-S3 (dual-core Xtensa, 8MB flash + 8MB PSRAM, native USB)
; ─────────────────────────────────────────────────────────────────────────────
; The header breaks out only GPIO 1-9 plus 43/44 — eleven usable pins.  Pick
; the board profile "xiao_s3" in the first-run wizard so pin validation knows
; that; "Generic ESP32-S3" would happily offer GPIO 10-18/21/38-42, none of
; which leave the module.
;
; Default I2C on the XIAO S3 header: D4/GPIO5 = SDA, D5/GPIO6 = SCL.
; Flow input on D3/GPIO4 (matches the esp32s3 devkit env).
;
; UNLIKE esp32s3_n16r8, this env needs no PSRAM wiring of its own: the
; seeed_xiao_esp32s3 board definition already carries -DBOARD_HAS_PSRAM and
; memory_type = qio_opi in its extra_flags, so the DataPipeline ring buffer
; lands in PSRAM (LOGGER_PSRAM_AVAILABLE = 1, verified with a build probe).
; Do not "tidy up" by copying the n16r8 block here — and do not assume the
; reverse either; the stock esp32-s3-devkitc-1 definition supplies neither.
; ─────────────────────────────────────────────────────────────────────────────
[env:xiao_esp32s3]
board     = seeed_xiao_esp32s3

board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
    ${env.build_flags}
    ; Same values the board definition already sets.  Redefining a macro to an
    ; IDENTICAL value is legal and warning-free; keep them in sync if either
    ; side changes, or GCC starts emitting "redefined" on every unit.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Pin overrides for XIAO ESP32-S3 wiring
    -DDEFAULT_SDA=5
    -DDEFAULT_SCL=6
    ; Second I2C controller (S3 has two).  The global fallbacks are GPIO 10/11,
    ; which on this board go to the camera/SD B2B connector and never reach the
    ; header — so the UI would offer a default pair the user cannot wire.  D0/D1
    ; are free once bus 0 takes 5/6 and the flow input takes 4; GPIO 7/8/9 are
    ; left alone so the SPI header stays usable.  Needs its own pull-ups.
    -DDEFAULT_SDA1=1
    -DDEFAULT_SCL1=2
    -DDEFAULT_FLOW_PIN=4

upload_speed    = 921600
monitor_filters = esp32_exception_decoder

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 N16R8 — 16 MB flash + 8 MB OCTAL PSRAM (e.g. Waveshare
; ESP32-S3-DEV-KIT-N16R8, YD-ESP32-S3 N16R8)
; ─────────────────────────────────────────────────────────────────────────────
; A SEPARATE env rather than a change to [env:esp32s3], because the two differ
; in flash geometry: this partition table puts LittleFS at 0xC90000, past the
; end of an 8 MB part.  Flashing this image to a stock DevKitC-1-N8 gives a
; filesystem mount failure and a boot into safe mode.  Keeping them apart also
; keeps the firmware-esp32s3.bin release artifact meaning what it always meant.
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3_n16r8]
extends   = env:esp32s3

board_build.partitions  = default_16MB.csv
board_upload.flash_size = 16MB

; This line is what actually makes the 8 MB PSRAM appear.  The stock
; esp32-s3-devkitc-1 definition builds for qio_qspi, which cannot talk to an
; octal part, and the RAM is then silently absent at runtime with only
; "PSRAM not found" in the boot log.
;
; Boards with QUAD PSRAM (…R2, …R8V variants) need qio_qspi instead — leaving
; this on qio_opi for a quad part is the mirror-image failure.
;
; Octal PSRAM also claims GPIO 35/36/37, already covered by the S3 board
; profile's flash-pin list (26–37), so pin validation refuses them either way.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

build_flags =
    ${env:esp32s3.build_flags}
    ; Enables the PSRAM allocator path in DataPipeline.h.  Without it the ring
    ; buffer stays on the internal-SRAM budget even with PSRAM fitted.
    -DBOARD_HAS_PSRAM

; ─────────────────────────────────────────────────────────────────────────────
; chaos_simulator — Phase 3 resilience build (XIAO ESP32-C3 base).
; Compiles in the gated chaos/telemetry hooks (src/chaos/*) so the firmware can
; be run under the Wokwi emulator and stress-tested in CI.  NEVER flash this to
; a production device — it deliberately drops WiFi, starves mutexes and holds
; heap.  See tests/chaos/README.md.
; ─────────────────────────────────────────────────────────────────────────────
[env:chaos_simulator]
extends   = env:xiao_esp32c3
build_flags =
    ${env:xiao_esp32c3.build_flags}
    -DENABLE_CHAOS_TELEMETRY=1
    -DENABLE_CHAOS_MONKEY=1
    ; Route Serial to UART0 instead of the USB Serial/JTAG (HWCDC).  The XIAO
    ; ESP32-C3 base defaults to CDC-on-boot, so app Serial.print goes to USB —
    ; but Wokwi's serial monitor reads UART0 (GPIO20/21).  Result: we see the
    ; ROM bootloader (always UART0) then silence once the app starts.  Forcing
    ; CDC off puts app output on UART0 where Wokwi (and the validator) can read it.
    ; NOTE: this deliberately redefines a macro the xiao base already set, so GCC
    ; emits a "<command-line>: warning: ... redefined" for it.  That warning is
    ; expected and specific to this env.  Do NOT try to silence it with -U:
    ; PlatformIO puts -D into CPPDEFINES and -U into CCFLAGS, and SCons emits
    ; every -D before any -U, so the macro would end up undefined, not overridden.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; With Serial on UART0, GPIO21 (= UART0 TX) must stay free.  The xiao base
    ; sets -DDEFAULT_FLOW_PIN=21; HardwareManager's pinMode(flow, INPUT_PULLUP)
    ; would clobber TX, so re-pin the flow sensor for the simulator (last -D wins,
    ; same -U caveat as above).
    -DDEFAULT_FLOW_PIN=2
    ; Optional overrides (defaults live in src/chaos/*.h):
    ; -DCHAOS_SEED=0x5eed1234
    ; -DCHAOS_DURATION_MS=150000
