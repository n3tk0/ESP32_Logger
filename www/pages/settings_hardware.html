  <main class="main-content page" id="page-settings_hardware">
    <div class="page-header">
      <h1>🔧 Hardware</h1>
      <div class="breadcrumb"><a href="#settings">Settings</a> / Hardware
      </div>
    </div>

    <div class="alert alert-warning">⚠️ Changes require device restart to take effect.</div>

    <!-- Board diagram (if configured) — populated by hwInit() -->
    <div id="boardDiagramCard" class="card" style="display:none">
      <div class="card-body text-center">
        <img id="boardDiagram" src="" style="max-width:100%;height:auto"
          data-error="hideParent">
      </div>
    </div>

    <!-- Form rendered from HW_SCHEMA via Form.bind() in hwInit() -->
    <div id="hw-host"></div>

    <!-- ─── Additional sensors (platform_config.json pipeline) ─────────────── -->
    <!-- Moved here from the Flow Meter page in chunk G so the sensor list is
         visible on every build, even without SENSOR_WATERFLOW_ENABLED. -->
    <div class="card" style="margin-top:1.5rem">
      <div class="card-header">
        <span>🌡️ Sensors</span>
        <button type="button" class="btn btn-sm btn-primary" data-click="clAddSensor">+ Add Sensor</button>
      </div>
      <div class="card-body" style="padding:0">
        <div id="cl-sensors-list">
          <p class="text-muted" style="padding:1rem">Loading…</p>
        </div>
      </div>
    </div>
    <div id="ss-msg"></div>
    <button type="button" class="btn btn-primary btn-block" style="margin-top:1rem" data-click="clSave">💾 Save Sensor List</button>
  </main>
