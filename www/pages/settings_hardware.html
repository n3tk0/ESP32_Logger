  <section class="page" id="page-settings_hardware">
    <div class="page-head">
      <h1 class="page-title"><span data-icon="wrench"></span> <span data-i18n="settingsPages.hwTitle">Hardware</span></h1>
      <div class="page-sub"><a href="#settings" data-i18n="chrome.navSettings">Settings</a> / <span data-i18n="settingsPages.hwTitle">Hardware</span>
      </div>
    </div>

    <div class="alert alert-warning"><span data-icon="alert-triangle"></span> <span data-i18n="settingsPages.hwRestartWarning">Changes require device restart to take effect.</span></div>

    <!-- Board diagram (if configured) — populated by hwInit() -->
    <div id="boardDiagramCard" class="card" style="display:none">
      <div class="card-body text-center">
        <img id="boardDiagram" src="" style="max-width:100%;height:auto"
          data-error="hideParent">
      </div>
    </div>

    <!-- The board's header, drawn from /boards.json + the firmware's pin
         lists, with every pin this page and the sensor list use marked —
         hwWirePins() in settings.js. Hidden until a board profile loads. -->
    <div id="hwPinMapCard" class="card" style="display:none">
      <div class="card-head"><div class="card-title"><span data-icon="cpu"></span> <span data-i18n="pins.boardTitle">Board pins</span></div></div>
      <div class="card-body">
        <p class="hint" id="hwPinMapHint"></p>
        <div id="hwPinMap" class="pm-wrap"></div>
      </div>
    </div>

    <!-- Form rendered from HW_SCHEMA via Form.bind() in hwInit() -->
    <div id="hw-host"></div>

    <!-- ─── Additional sensors (platform_config.json pipeline) ─────────────── -->
    <!-- Moved here from the Flow Meter page in chunk G so the sensor list is
         visible on every build, even without SENSOR_WATERFLOW_ENABLED. -->
    <div class="card" style="margin-top:1.5rem">
      <div class="card-head">
        <div class="card-title"><span data-icon="thermometer"></span> <span data-i18n="settingsPages.hwSensors">Sensors</span></div>
        <button type="button" class="btn primary" data-click="clAddSensor">+ <span data-i18n="settingsPages.hwAddSensor">Add Sensor</span></button>
      </div>
      <div class="card-body" style="padding:0">
        <div id="cl-sensors-list">
          <p class="text-muted" style="padding:1rem" data-i18n="common.loading">Loading…</p>
        </div>
      </div>
    </div>
    <div id="ss-msg"></div>
    <button type="button" class="btn primary" style="margin-top:1rem" data-click="clSave"><span data-icon="save"></span> <span data-i18n="settingsPages.hwSaveSensorList">Save Sensor List</span></button>
  </section>
