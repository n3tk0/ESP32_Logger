<!-- ════════════════════════════════════════════════════════════════════════
     Settings → Network & Time (aggregator subpage)
     WiFi + NTP are connectivity-adjacent and both small; grouping them
     halves the time-to-find on the Settings hub for fresh users.
     ════════════════════════════════════════════════════════════════════ -->
<section class="page" id="page-settings_netime">
  <div class="page-head">
    <div>
      <h1 class="page-title"><span data-icon="wifi"></span> <span data-i18n="settingsHub.netime">Network &amp; Time</span></h1>
      <div class="page-sub" data-i18n="settingsHub.netimeSub">WiFi · AP · hostname · NTP · timezone</div>
    </div>
    <div class="page-actions">
      <a href="#settings" data-page="settings" data-click="navPage" class="btn"><span data-icon="chevron-left"></span> <span data-i18n="settingsPages.allSettings">All settings</span></a>
    </div>
  </div>

  <div class="grid grid-auto">
    <div class="set-card" data-click="showSubpage" data-args='["settings_network"]'>
      <div class="set-card-icon"><span data-icon="wifi"></span></div>
      <div class="set-card-t" data-i18n="settingsPages.netTitle">Network</div>
      <div class="set-card-d" data-i18n="settingsPages.netimeNetworkDesc">WiFi · AP · hostname · scan</div>
    </div>
    <div class="set-card" data-click="showSubpage" data-args='["settings_time"]'>
      <div class="set-card-icon"><span data-icon="clock"></span></div>
      <div class="set-card-t" data-i18n="settingsPages.netimeTimeSync">Time sync</div>
      <div class="set-card-d" data-i18n="settingsPages.netimeTimeSyncDesc">NTP server · timezone · RTC</div>
    </div>
  </div>
</section>
