<!-- ════════════════════════════════════════════════════════════════════════
     Settings → Platform (aggregator subpage)
     Replaces three separate Settings hub cards (Hardware / Core logic /
     Modules) with one entry-point.  Links out to the full detail pages.
     The split was a small-screen pain point: tapping a card → drilling
     into a detail page → backing out → tapping the next one wastes time
     when configuring the platform end-to-end.
     ════════════════════════════════════════════════════════════════════ -->
<section class="page" id="page-settings_platform">
  <div class="page-head">
    <div>
      <h1 class="page-title"><span data-icon="cpu"></span> <span data-i18n="settingsPages.platformTitle">Platform</span></h1>
      <div class="page-sub" data-i18n="settingsPages.platformSubtitle">Operating mode · pins · sensors · modules</div>
    </div>
    <div class="page-actions">
      <a href="#settings" data-page="settings" data-click="navPage" class="btn"><span data-icon="chevron-left"></span> <span data-i18n="settingsPages.allSettings">All settings</span></a>
    </div>
  </div>

  <div class="grid grid-auto">
    <div class="set-card" data-click="showSubpage" data-args='["settings_corelogic"]'>
      <div class="set-card-icon"><span data-icon="layers"></span></div>
      <div class="set-card-t" data-i18n="settingsPages.platformCoreLogic">Core logic</div>
      <div class="set-card-d" data-i18n="settingsPages.platformCoreLogicDesc">Operating mode · sensor pipeline · aggregation</div>
    </div>
    <div class="set-card" data-click="showSubpage" data-args='["settings_hardware"]'>
      <div class="set-card-icon"><span data-icon="cpu"></span></div>
      <div class="set-card-t" data-i18n="settingsPages.hwTitle">Hardware</div>
      <div class="set-card-d" data-i18n="settingsPages.platformHardwareDesc">Pins · board diagram · transports</div>
    </div>
    <div class="set-card" data-click="showSubpage" data-args='["settings_modules"]'>
      <div class="set-card-icon"><span data-icon="layers"></span></div>
      <div class="set-card-t"><span data-i18n="settingsPages.modTitle">Modules</span> <span class="badge dim" style="margin-left:6px" data-i18n="settingsPages.platformPreview">preview</span></div>
      <div class="set-card-d" data-i18n="settingsPages.platformModulesDesc">Optional plug-in features</div>
    </div>
  </div>

  <p class="hint" style="margin-top:var(--gap)" data-i18n-html="settingsPages.platformSearchTip">
    Tip: search across every setting field with <kbd>⌘K</kbd> / <kbd>Ctrl K</kbd>.
  </p>
</section>
