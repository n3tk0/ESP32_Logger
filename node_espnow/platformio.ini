; ─────────────────────────────────────────────────────────────────────────────
; ESP32_Logger battery node — XIAO ESP32-C3 over ESP-NOW
; ─────────────────────────────────────────────────────────────────────────────
; A SEPARATE PlatformIO project, for the same reason node/ is one: PlatformIO
; resolves src_dir once per project, and `pio run` in the repository root would
; otherwise try to build the collector's FreeRTOS pipeline, async web server
; and plugin registry into a firmware whose entire job is to wake up, read one
; sensor, send twenty-four bytes and go back to sleep.
;
; WHAT IS SHARED, AND WHY IT HAS TO BE
; ------------------------------------
; Three headers from the collector's tree, reachable through -I..:
;
;   src/espnow/EspNowProto.h   the wire format. Both ends compile it, so a
;                              change is a change to both or it does not build.
;   src/espnow/EspNowAuth.h    the DISCOVER signature. Two implementations of
;                              a signature is how a node pairs with nothing
;                              while each side looks correct on its own.
;   src/drivers/BME280_Mini.h  the same compensation maths on both ends.
;
; Nothing else is shared and nothing is copied.
;
; THE KEY MUST MATCH THE COLLECTOR'S
; ----------------------------------
; ESPNOW_LMK here and ESPNOW_LMK there are the same 16 bytes or nothing pairs
; and nothing decrypts. Set both, and set them to something that is not the
; default.
;
; Build:   cd node_espnow && pio run
; Upload:  cd node_espnow && pio run -t upload
; ─────────────────────────────────────────────────────────────────────────────

[env:xiao_esp32c3]
platform  = platformio/espressif32@7.0.1
board     = seeed_xiao_esp32c3
framework = arduino

build_flags =
    -I..
    -Wall
    -Wextra
    ; No exceptions, same as the collector: nothing here throws, and the
    ; unwind tables are pure weight in a firmware this size.
    -fno-exceptions
    ; The keys are NOT set here. src/node_config.h declares both with #ifndef
    ; and a placeholder, so a hand build still gets one — and PLATFORMIO_BUILD_
    ; FLAGS can then override it without redefining a macro this file already
    ; defined. Setting them here made the header's #ifndef dead and turned the
    ; deploy tool's key into a redefinition warning that only sometimes won.
    ;
    ; Change them in node_config.h, or let the deploy tool generate a key and
    ; pass it to both sides. It is the shared secret with the collector: the
    ; same 16 bytes here and there, or nothing pairs.

; Nothing. Not ArduinoJson, not a sensor library — the wire format is packed
; structs and the BME280 driver is the collector's header-only one.
lib_deps =

monitor_speed = 115200
upload_speed  = 921600

; ─────────────────────────────────────────────────────────────────────────────
; A build for bringing a node up on the bench.
;
; Keeps the part awake between sends instead of deep sleeping, so the serial
; console stays attached and you can watch a pairing attempt or a channel
; rescan happen. Useless on a battery and says so at boot.
; ─────────────────────────────────────────────────────────────────────────────
[env:xiao_esp32c3_bench]
extends    = env:xiao_esp32c3
build_flags =
    ${env:xiao_esp32c3.build_flags}
    -DNODE_NO_DEEP_SLEEP
    -DNODE_INTERVAL_S=10
