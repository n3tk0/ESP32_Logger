# ============================================================================
# The standalone page — Paperwhite 4 (1072×1448)
#
# The twin of 600x800-standalone.conf, and sourced the same way: on top of
# 1072x1448.conf, carrying only the numbers that move. Read that file first —
# it explains what this page is, where the forecast band went, and why the type
# grew by a sixth rather than by a third.
#
# EVERY NUMBER HERE IS kdPx() OF THE 600 px ONE, which is the same arithmetic
# the firmware uses to build the browser page at KINDLE_PAGE_W. That is why
# tools/check_kindle_parity.py can compare one CSS pixel against both panels,
# and why the two cannot drift apart by hand-rounding.
#
#    36 ┌ top block      36…725
#   725 ├ chart          772…1168, key 1169
#  1208 ├ month          ← unchanged
#  1251 ├ week strip     ← unchanged
#  1365 ├ footer         ← unchanged
#  1448 └
# ============================================================================

# ── The headline ─────────────────────────────────────────────────────────────
# HERO_Y is unchanged: the block still starts where it started.
HERO_SZ=186
BIG_SZ=86
HEAD_GAP=16
SLASH_W=46

# The 24 h low-to-high, 16 px under a headline that now ends at 142.
SUB_Y=282
SUB_SZ=34

# ── The grid ─────────────────────────────────────────────────────────────────
# Two rows of 92 from 196 ends at 380, 26 px clear of the chart's rule. The
# captions grow with the values: at 42 px a 14 px caption reads as a footnote
# to the number rather than as its name.
GRID_Y=350
GRID_ROW_H=164
GRID_VAL_SZ=75
GRID_VAL_SZ_3=55
GRID_LAB_SZ=27
GROUP_LAB_SZ=27

# ── The clock ────────────────────────────────────────────────────────────────
# CL_H is one taller than CL_SIZE, as in the base file: the rectangle is
# CLEARED before the time is drawn, so it has to cover every pixel the digits
# can reach and nothing below them. 26 + 111 = 137, one clear of the indoor
# rule at 138.
#
# The three styles keep the block at the height the plain clock sets, the way
# they keep it at 100 in the base layout — see the `.sa .clock` twins in
# kdSkinCss().
CL_SIZE=197
CL_H=198
CL_SZ_BOXED=172
CL_SZ_RULED=147
CL_RULED_PAD=32
CL_SZ_DATED=132
CL_DATE_SZ=29
CL_DATE_GAP=13

# ── The indoor row ───────────────────────────────────────────────────────────
IN_RULE_Y=247
IN_LAB_Y=272
IN_VAL_Y=339
IN_VAL_SZ=61
IN_VAL_SZ_1=100

# The hairline between the columns, down the taller of the two.
SEP_H=672

# ── The chart, 124 px lower and not a pixel different ────────────────────────
RULE2_Y=725
LAB_CHART_Y=736
GR_Y=772
# 772 + 396 = 1168, so the key goes one row lower than the scale gives:
# a key drawn on that row would sit on the chart's own bottom edge.
KEY_Y=1169

# ── Where the forecast was ───────────────────────────────────────────────────
# RULE3_Y IS NOT ONLY A RULE. zones_derive() cuts the refresh rectangles at
# it: the chart is refreshed from RULE2_Y to here, and everything from here to
# the bottom edge is the third rectangle. Set to the week heading's own rule,
# so the chart's rectangle reaches it and the bottom one is exactly the week
# strip and the footer — which is what they were under the forecast all along.
#
# Nothing draws a line here: fc_wanted() is false on this page, so the rule
# that used to sit at RULE3_Y is the week heading's, already drawn by the
# week block.
RULE3_Y=1208
