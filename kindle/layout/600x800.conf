# the column's left edge on white, so three tidy grey cards came out as three
# ragged left-aligned stacks. #f0f0f0 is not in FBInk's palette — it runs
# GRAY1..GRAY9 then GRAYA..GRAYE — and GRAYE (#ee) is the nearest.
