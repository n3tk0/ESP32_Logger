# ── Slot flow ────────────────────────────────────────────────────────────────
# The configurable readings. The collector decides WHICH values go where, in
# rows and twelfths; these numbers turn that into pixels for this panel.
#
# The area stops above RULE2_Y (255), so the flow has 235 px from SLOT_Y. Only
# the hero spends a line on its label; the rest set it inline with the value, so
# a row is one line and the heights below are what one line needs. The built-in
# six pack into four rows — 104 + 40 + 52 + 40 = 236 — which is the budget, and
# is why they came down from 118/74/56: at those the default list ran 304 px and
# the last row was drawn over the chart.
#
# A longer list still overflows into the chart. That is the reader's own choice
# to make and is visible the moment they make it.
SLOT_X=18
SLOT_Y=20
SLOT_W=564

SLOT_ROW_H_HERO=104
SLOT_ROW_H_LARGE=52
SLOT_ROW_H=40

# How much height the flow may use before it is truncated, so a list longer
# than the page cannot be drawn over the chart heading below it.
SLOT_AREA_H=235

SLOT_LABEL_SZ=12
# Average advance of an upper-case glyph, as a percentage of the label's size.
# Used to place the value after an inline label, because FBInk will not say how
# wide it drew one. Raise it if labels collide with values on your panel.
SLOT_LABEL_ADV=62
# Floor for that width, so the numbers down a column all start at the same x.
SLOT_LABEL_MINW=40
SLOT_VAL_SZ_HERO=80
SLOT_VAL_SZ_LARGE=44
SLOT_VAL_SZ_MEDIUM=32
SLOT_VAL_SZ_SMALL=26
