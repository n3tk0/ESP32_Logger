# ============================================================================
# Layout coordinates for Kindle 7th Gen (600×800, 167 ppi)
# Mapped from the 600px CSS layout of the original HTML dashboard.
# ============================================================================

# ── Section label style ──
LAB_SZ=12

# ── Outside section ──
LAB_OUT_X=18
LAB_OUT_Y=20

# Hero temperature (big number).
#
# LEGACY_ PREFIXED, and it has to be. These belong to the hardwired layout the
# fallback path in update_dash.sh draws when the collector is running older
# firmware. The current layout's block at the foot of this file used the same
# four names — HERO_Y, HERO_SZ, SUB_Y, SUB_SZ — and is sourced AFTER them, so
# the fallback was quietly drawing its hero at the current layout's coordinates.
# Nothing looked broken; it was four pixels out and one size too big.
LEGACY_HERO_X=18
LEGACY_HERO_Y=40
LEGACY_HERO_SZ=80

# Humidity (right of hero)
HUM_X=260
HUM_Y=50
HUM_SZ=40

# Subtitle (range + age)  — see the LEGACY_ note above
LEGACY_SUB_X=18
LEGACY_SUB_Y=125
LEGACY_SUB_SZ=14

# Pressure
PRES_X=18
PRES_Y=145
PRES_SZ=30

# Tendency
TEND_X=18
TEND_Y=178
TEND_SZ=14

# Battery icon position
BATT_X=240
BATT_Y=18

# ── Clock (top of the right column) ──
CL_X=318
CL_Y=26
CL_SIZE=96
CL_W=264
# The clock's rectangle is CLEARED before the time is drawn and FLASHED after
# it, so anything else inside it is erased once a minute. It must stop above
# the rule over the indoor row: CL_Y 26 + 97 = 123, one pixel clear of IN_RULE_Y 124.
# It is one taller than CL_SIZE so the digits it clears cannot reach past it.
CL_H=97

# The four clock styles the page offers. kdSkinCss() sets them in CSS at 84,
# 72 and 66 px against the plain clock's 96, and at this panel's scale those
# are the same numbers — tools/check_kindle_parity.py holds them to it.
#
# PLAIN draws at CL_SIZE and nothing else. BOXED knocks the time out of a black
# plate filling the whole clock rectangle. RULED puts a hairline over it and
# sets it smaller. DATED sets it smaller again and puts the date underneath.
CL_SZ_BOXED=84
CL_SZ_RULED=72
CL_RULED_PAD=16
CL_SZ_DATED=66
CL_DATE_SZ=15
CL_DATE_GAP=6

# ── Divider 1 (after outdoor+clock) ──
RULE1_X=18
RULE1_Y=195
RULE1_W=564

# ── Inside section ──
LAB_IN_X=18
LAB_IN_Y=200
IN_X=18
IN_Y=216
IN_SZ=34

# ── Divider 2 (after indoor) ──
RULE2_X=18
RULE2_Y=255
RULE2_W=564

# ── Trend chart section ──
LAB_CHART_X=18
LAB_CHART_Y=260
GR_X=20
GR_Y=278
GR_W=560
GR_H=200

# ── The chart's axis ──
# The image carries the grid and no numbers: drawing text into a 4-bit BMP
# would need a bitmap font the firmware does not have, so the five temperatures
# and the five hours arrive as text in /kindle/data and are placed here. The
# collector also sends where its plot area is inside the image (CH_L/R/T/B), so
# these are the type, not the geometry — the .ax rule on the page, which is
# 11 px at #777, with the value 7 px left of the axis and dropped 4 px onto the
# grid line, and the hour 8 px up from the image's bottom edge.
AX_SZ=11
AX_GAP=7
AX_BASE=4
HX_DROP=8

# ── The chart's key ──
# The same two entries the web page draws under its chart, at ITS numbers: the
# swatch is 26x9 with a 3 px solid stroke for the outdoor mean and a 2 px
# dashed one (7 on, 5 off) for the indoor line, and the type is 13 px at #444
# with the band clause after it at #777. See appendKeySwatch() and the .key
# rule in KindleDashboard.cpp. A key drawn in some other weight describes a
# chart the reader is not looking at.
#
# EVERYTHING BELOW THIS MOVED DOWN 16 px to make room, which the panel had
# spare — the footer used to finish at 683 of 800.
KEY_Y=482
KEY_SZ=13
KEY_SW_W=26
KEY_SW_H=3
KEY_SW_H_IN=2
KEY_DASH=7
KEY_DASH_GAP=5
KEY_GAP=6
# The indoor half, set to the right the way the page's two-cell table sets it.
KEY_IN_X=470

# ── Divider 3 (after chart) ──
RULE3_X=18
RULE3_Y=506
RULE3_W=564

# ── Forecast section ──
LAB_FC_X=18
LAB_FC_Y=511

# Current condition
FC_ICON_X=18
FC_ICON_Y=528
FC_MAIN_SZ=52
FC_TEXT_X=78
FC_TEXT_Y=531
FC_TEXT_SZ=28
FC_TEMP_X=78
FC_TEMP_Y=559
FC_TEMP_SZ=30
FC_WIND_X=78
FC_WIND_Y=586
FC_WIND_SZ=14

# Outlook columns (3 side by side)
#
# EACH ON ITS OWN PLATE, and centred on it. The page sets .per to
# `width:88px; text-align:center; background:#f0f0f0` with a 4 px white gutter
# between columns; the panel drew the label, the icon and the temperature at
# the column's left edge on white, so three tidy grey cards came out as three
# ragged left-aligned stacks. #f0f0f0 is not in FBInk's palette — it runs
# GRAY1..GRAY9 then GRAYA..GRAYE — and GRAYE (#ee) is the nearest.
OL_PLATE_W=88
OL_PLATE_H=80
OL_PLATE_TOP=4
FC_OL_SZ=34
OL_LABEL_SZ=11
OL_TEMP_SZ=19
OL_ICON_OFFSET=16
OL_TEMP_OFFSET=54
OL0_X=320
OL0_Y=516
OL1_X=410
OL1_Y=516
OL2_X=500
OL2_Y=516

# ── Week heading (month) ──
# The web page draws "AUGUST – SEPTEMBER" above the week strip.
# A rule, a section heading, and the strip below it.
WK_HDG_RULE_X=18
WK_HDG_RULE_Y=604
WK_HDG_RULE_W=564
WK_HDG_X=18
WK_HDG_Y=609
WK_HDG_SZ=12

# ── Week strip ──
WK_X=18
WK_Y=626
WK_CELL_W=81
WK_CELL_H=48
WK_NAME_OFFSET=5
WK_NAME_SZ=11
WK_DAY_OFFSET=20
WK_DAY_SZ=24

# ── Footer ──
FOOT_RULE_X=18
FOOT_RULE_Y=680
FOOT_RULE_W=564
FOOT_X=18
FOOT_Y=688
FOOT_SZ=12

# ── Hairline thickness ──
# FBInk has no line primitive, so a rule is a rectangle this many pixels tall.
# One pixel at 167 ppi is the hairline it looks like.
RULE_H=1

# ── Icons directory ──
ICON_DIR="$DASH_DIR/icons/600"

# ── The eleven places ────────────────────────────────────────────────────────
# The top of the page is two columns. On the left the outdoor headline, the
# 24 h line under it and a grid of up to three across and two deep; on the right
# the clock with the indoor row under it. The collector decides WHAT is in each
# place and how the grid breaks into rows; these numbers are where they land on
# this panel.
#
# The whole block has to finish above RULE2_Y (255), which is where the chart
# section starts. The left column is the taller of the two: a second grid row of
# values ends at 239.
TOP_Y=20

COL_L_X=18
COL_L_W=270
COL_R_X=318
COL_R_W=264

# The hairline between the columns. SEP_W=0 turns it off.
SEP_X=300
SEP_W=1
SEP_H=210

# One caption style for the whole page: small, tracked, grey.
GROUP_LAB_SZ=10

# The headline. HERO and BIG share a baseline with a slash between them, so
# BIG's x depends on how wide HERO came out — the collector measures that and
# sends it as Z_HERO_ADVW, in thousandths of the type size.
HERO_Y=36
HERO_SZ=88
BIG_SZ=44
HEAD_GAP=8
SLASH_W=22

# The 24 h low-to-high and the age. Drawn in GRAY7: context for the number
# above it, not a reading of its own.
SUB_Y=126
SUB_SZ=14

# The grid, caption above value. A row divides COL_L_W by its own cell count,
# so the column width is not a constant here — only the row pitch and the two
# type sizes are. Three across is narrower than two, and "1008 hPa" with a
# tendency arrow after it does not fit a third of this column at 31.
GRID_Y=148
GRID_ROW_H=46
GRID_LAB_SZ=10
GRID_VAL_SZ=31
GRID_VAL_SZ_3=26

# The indoor row under the clock: three fields or two, the first set much larger
# and carrying NO caption — the heading above already says which room this is.
# All the values sit on one bottom edge, which the script works out from the two
# sizes, and the smaller two hang their captions above themselves.
IN_RULE_Y=124
IN_LAB_Y=132
IN_VAL_Y=156
IN_VAL_SZ=28
IN_VAL_SZ_1=52
