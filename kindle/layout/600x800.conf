# ── The nine places ──────────────────────────────────────────────────────────
# The top of the page is two columns. On the left the outdoor headline, the
# 24 h line under it and a two-by-two grid; on the right the clock with the
# indoor row under it. The collector decides WHAT is in each place; these
# numbers are where they land on this panel.
#
# The whole block has to finish above RULE2_Y (255), which is where the chart
# section starts. The left column is the taller of the two: the grid's second
# row of values ends at 250.
TOP_Y=20

COL_L_X=18
COL_L_W=270
COL_R_X=318
COL_R_W=264

# The hairline between the columns. SEP_W=0 turns it off.
SEP_X=300
SEP_W=1
SEP_H=210

# One caption style for the whole page: small, tracked, grey.
GROUP_LAB_SZ=12

# The headline. HERO and BIG share a baseline with a slash between them, so
# BIG's x depends on how wide HERO came out — the collector measures that and
# sends it as Z_HERO_ADVW, in thousandths of the type size.
HERO_Y=38
HERO_SZ=84
BIG_SZ=44
HEAD_GAP=8
SLASH_W=22

# The 24 h low-to-high and the age.
SUB_Y=128
SUB_SZ=15

# The two-by-two grid, caption above value.
GRID_Y=152
GRID_COL_W=135
GRID_ROW_H=50
GRID_LAB_SZ=12
GRID_VAL_SZ=32

# The indoor row under the clock: three fields or two, the first set larger.
