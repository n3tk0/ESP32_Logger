FOOT_X=18
FOOT_Y=772
FOOT_SZ=15

# The right-hand end of the footer: the reader's own battery, which power mode
# it is in, and — in brackets, when the collector is not answering — when it
# last did. LEFT-ALIGNED AT STAT_X, because FBInk will not say how wide it drew
# a string, so there is no right edge to align to; the x leaves room for the
# longest of them at STAT_SZ.
STAT_X=396
STAT_Y=772
STAT_SZ=15

# ── Hairline thickness ──
# FBInk has no line primitive, so a rule is a rectangle this many pixels tall.
# One pixel at 167 ppi is the hairline it looks like.
RULE_H=1

# ── Icons directory ──
ICON_DIR="$DASH_DIR/icons/600"

# ── The eleven places ────────────────────────────────────────────────────────
# The top of the page is two columns. On the left the outdoor headline, the
# 24 h line under it and a grid of up to three across and two deep; on the right
# the clock with the indoor row under it. The collector decides WHAT is in each
# place and how the grid breaks into rows; these numbers are where they land on
# this panel.
#
# The whole block has to finish above RULE2_Y (282), which is where the chart
# section starts. The left column is the taller of the two: a second grid row of
# values ends at 271.
TOP_Y=20

COL_L_X=18
COL_L_W=270
COL_R_X=318
COL_R_W=264

# The hairline between the columns. SEP_W=0 turns it off.
SEP_X=300
SEP_W=1
SEP_H=252

# One caption style for the whole page: small, tracked, grey.
GROUP_LAB_SZ=14

# The headline. HERO and BIG share a baseline with a slash between them, so
# BIG's x depends on how wide HERO came out — the collector measures that and
# sends it as Z_HERO_ADVW, in thousandths of the type size.
HERO_Y=38
HERO_SZ=88
BIG_SZ=44
HEAD_GAP=8
SLASH_W=22

# The 24 h low-to-high and the age. Drawn in GRAY7: context for the number
# above it, not a reading of its own.
SUB_Y=128
SUB_SZ=17

# The grid, caption above value. A row divides COL_L_W by its own cell count,
# so the column width is not a constant here — only the row pitch and the two
# type sizes are. Three across is narrower than two, and "1008 hPa" with a
# tendency arrow after it does not fit a third of this column at 34.
GRID_Y=158
GRID_ROW_H=58
GRID_LAB_SZ=14
GRID_VAL_SZ=34
GRID_VAL_SZ_3=27

# The indoor row under the clock: three fields or two, the first set much larger
# and carrying NO caption — the heading above already says which room this is.
# All the values sit on one bottom edge, which the script works out from the two
# sizes, and the smaller two hang their captions above themselves.
IN_RULE_Y=124
IN_LAB_Y=134
IN_VAL_Y=166
IN_VAL_SZ=31
IN_VAL_SZ_1=52

# ── FBInk's px against the design's px ───────────────────────────────────────
# (ascent - descent) / unitsPerEm for the panel's font, in thousandths.
#
# FBInk sizes OpenType text with stbtt_ScaleForPixelHeight(font, px), which
# stb_truetype documents as `scale = pixels / (ascent - descent)`: its `px` is
# the whole line height, ascender to descender. CSS font-size is the em square,
# some 14-20% smaller than that span for a text serif. Every size below is the
# design's CSS pixel, so draw_text() multiplies by this to get the px FBInk has
# to be asked for — without it the panel drew a sixth small, and every gap
# computed from an advance-in-mille came out a sixth too wide.
#
# THE ONE NUMBER TO TURN if the type ends up a hair large or small. Bookerly
# and Caecilia, the two faces this panel picks from, both sit near 1160; the
# sane band is about 1100 to 1250.
TEXT_PX_MILLE=1160
