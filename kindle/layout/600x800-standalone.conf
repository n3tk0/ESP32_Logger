# ============================================================================
# The standalone page — Kindle 7th Gen (600×800)
#
# SOURCED ON TOP OF 600x800.conf, NOT INSTEAD OF IT. Only the numbers that move
# are here, so the base file stays the one description of this panel and a key
# added there cannot be forgotten in this one.
#
# WHAT THIS IS FOR. A collector running as its own access point — wifi and
# ESP-NOW nodes talking straight to it, nothing upstream — cannot fetch a
# forecast, and the forecast band is 124 px of this 800 px screen. Left in
# place it is white space with a rule over it. Here it is gone and the readings
# have it.
#
#    20 ┌ top block      20…406      (was 20…282)
#   406 ├ chart          432…652, key 654
#   676 ├ month          ← unchanged
#   700 ├ week strip     ← unchanged
#   764 ├ footer         ← unchanged
#   800 └
#
# ── WHY THE TYPE GREW BY A SIXTH AND NOT BY A THIRD ─────────────────────────
#
# The 124 px is VERTICAL space. The columns are the same width they always
# were, and every number on this page is limited by the column it sits in, not
# by the room above it:
#
#   the clock        "17:40" at 110 px is 260 of the 264 px column
#   the grid, three  "1008 hPa" at 31 px is 87 of the 90 px cell
#   the indoor row   "21.4°" at 56 px is 110 of the 111 px first cell
#   the grid, two    "1008 hPa" at 42 px is 117 of the 135 px cell
#
# Each of those is the widest string that reading can produce, measured with
# the same per-character advance the preview uses (kdTw in www/js/kindle.js).
# A size a third larger would overrun its column on the day the pressure went
# to four digits — which is every day — and FBInk does not wrap: it draws
# straight over whatever is beside it. So the sizes below are what fits, and
# the height left over becomes air around them, which is worth having on a
# panel read from across a room.
#
# THE HEADLINE IS THE ONE EXCEPTION, and it is one the base layout already
# makes: "8.4° / 71%" at 104/48 ends at 261, inside the 288 px column, but the
# worst case this page can produce — "-12.4° / 100%" — ends at 375, past the
# column and into the clock's rectangle, where the clock tier clips it. The
# base layout does the same at 329, and the design comment on .head in
# src/web/KindleDashboard.cpp says so: the pair is nowrap, and the sizes are
# measured against the widest it gets.
#
# EVERY TYPE SIZE HERE HAS A TWIN in the `.sa` rules of the stylesheet in
# src/web/KindleDashboard.cpp, and tools/check_kindle_parity.py holds the two
# together exactly as it holds the base layout and the design together.
# ============================================================================

# ── The headline ─────────────────────────────────────────────────────────────
# HERO_Y is unchanged: the block still starts where it started.
HERO_SZ=104
BIG_SZ=48
HEAD_GAP=9
SLASH_W=26

# The 24 h low-to-high, 16 px under a headline that now ends at 142.
SUB_Y=158
SUB_SZ=19

# ── The grid ─────────────────────────────────────────────────────────────────
# Two rows of 92 from 196 ends at 380, 26 px clear of the chart's rule. The
# captions grow with the values: at 42 px a 14 px caption reads as a footnote
# to the number rather than as its name.
GRID_Y=196
GRID_ROW_H=92
GRID_VAL_SZ=42
GRID_VAL_SZ_3=31
GRID_LAB_SZ=15
GROUP_LAB_SZ=15

# ── The clock ────────────────────────────────────────────────────────────────
# CL_H is one taller than CL_SIZE, as in the base file: the rectangle is
# CLEARED before the time is drawn, so it has to cover every pixel the digits
# can reach and nothing below them. 26 + 111 = 137, one clear of the indoor
# rule at 138.
#
# The three styles keep the block at the height the plain clock sets, the way
# they keep it at 100 in the base layout — see the `.sa .clock` twins in
# kdSkinCss().
CL_SIZE=110
CL_H=111
CL_SZ_BOXED=96
CL_SZ_RULED=82
CL_RULED_PAD=18
CL_SZ_DATED=74
CL_DATE_SZ=16
CL_DATE_GAP=7

# ── The indoor row ───────────────────────────────────────────────────────────
IN_RULE_Y=138
IN_LAB_Y=152
IN_VAL_Y=190
IN_VAL_SZ=34
IN_VAL_SZ_1=56

# The hairline between the columns, down the taller of the two.
SEP_H=376

# ── The chart, 124 px lower and not a pixel different ────────────────────────
RULE2_Y=406
LAB_CHART_Y=412
GR_Y=432
KEY_Y=654

# ── Where the forecast was ───────────────────────────────────────────────────
# RULE3_Y IS NOT ONLY A RULE. zones_derive() cuts the refresh rectangles at
# it: the chart is refreshed from RULE2_Y to here, and everything from here to
# the bottom edge is the third rectangle. Set to the week heading's own rule,
# so the chart's rectangle reaches it and the bottom one is exactly the week
# strip and the footer — which is what they were under the forecast all along.
#
# Nothing draws a line here: fc_wanted() is false on this page, so the rule
# that used to sit at RULE3_Y is the week heading's, already drawn by the
# week block.
RULE3_Y=676
