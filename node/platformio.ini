; ─────────────────────────────────────────────────────────────────────────────
; ESP32_Logger sensor node — ESP8266 satellite
; ─────────────────────────────────────────────────────────────────────────────
; A SEPARATE PlatformIO project, not another env in the root platformio.ini.
; PlatformIO resolves src_dir once per project, and this firmware shares no
; source tree with the collector beyond one header — so a second project is
; what keeps `pio run` in the repo root from trying to compile the ESP32
; pipeline for an 80 MHz Tensilica part with 80 KB of RAM.
;
; This is NOT a fork of the collector firmware.  The collector is built on
; FreeRTOS tasks, an async web server, LittleFS, a ring buffer and a plugin
; registry; none of that survives the move to an ESP8266, and none of it is
; needed to read one I2C sensor and POST the result.  What IS shared is the
; part that has to agree between the two devices: the BME280/BMP280 driver in
; ../src/drivers/BME280_Mini.h, which is header-only and speaks nothing but
; Wire.  Same compensation maths on both ends, one place to fix it.
;
; Build:   cd node && pio run
; Upload:  cd node && pio run -t upload
; ─────────────────────────────────────────────────────────────────────────────

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; The setup portal persists /config.json here.  Without this the default
; layout gives the filesystem no room and settingsSave() fails at runtime
; with nothing in the build output to explain why.
board_build.filesystem  = littlefs
board_build.ldscript    = eagle.flash.4m1m.ld

; The collector's drivers/ directory is reachable from src/, so the shared
; BME280_Mini.h include resolves without copying it into this project.
build_flags =
    -I..
    -Wall
    -Wextra

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3

monitor_speed   = 115200
monitor_filters = esp8266_exception_decoder
upload_speed    = 921600
